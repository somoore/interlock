[project]
name = "interlock-kernel"
version = "0.1.0"
description = "Capability kernel for untrusted agents. The LLM never talks to the OS."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Scott Moore" }]
dependencies = []

[project.optional-dependencies]
jev = ["typesafe>=0.1"]

[project.scripts]
interlock = "interlock.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
